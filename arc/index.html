<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JAVY.ARC — _personal_archive</title>
  <meta name="description" content="javy.arc — osobní archiv. Černobílé experimenty, termotisk, beton, zrno. Připravuje se." />
  <meta name="theme-color" content="#060605" />
  <link rel="stylesheet" href="arc.css?v=9" />
</head>
<body>

  <!-- textura: půltónový rastr + filmové zrno přes celou plochu -->
  <div class="tex" aria-hidden="true"></div>
  <div class="vig" aria-hidden="true"></div>

  <header class="hd">
    <span class="mark">P</span>
    <span class="sys">JAVY.ARC</span>
  </header>

  <main class="stage">
    <div class="row">
      <span>02 — VEDLEJŠÍ PROJEKT</span>
      <span class="r">EST. 2026</span>
    </div>

    <div class="print">
      <h1 class="word"><span class="fit">JAVY.ARC</span></h1>
      <span class="head" aria-hidden="true"></span>
    </div>

    <div class="row">
      <span class="status">[ PŘIPRAVUJE SE ]</span>
      <span class="r">PRAHA</span>
    </div>

    <p class="lede">osobní archiv</p>
    <a class="ig" href="https://www.instagram.com/javy.arc/" target="_blank" rel="noopener">@javy.arc ↗</a>

    <!-- kontaktní proužek: pár snímků přepálených do ditheru, jako termotisk -->
    <div class="sheet" id="sheet" aria-hidden="true"></div>
  </main>

  <footer class="ft">
    <a href="../">← JAVY / PORTFOLIO</a>
  </footer>

  <script>
    /* natažení názvu přes celou šířku — stejný princip jako na portfoliu */
    function fit() {
      document.querySelectorAll(".fit").forEach((el) => {
        el.style.transform = "";
        const pw = el.parentElement.clientWidth, tw = el.scrollWidth;
        if (pw > 0 && tw > 0) el.style.transform = `scaleX(${(pw / tw).toFixed(4)})`;
      });
    }
    fit();
    addEventListener("resize", fit);
    document.fonts && document.fonts.ready.then(fit);
    setTimeout(fit, 120);

    /* proužek snímků = vlastní archiv javy.arc (photos.json vedle stránky).
       Vybírá se rovnoměrně napříč archivem, nejnovější příspěvky první. */
    (async () => {
      try {
        const d = await fetch("photos.json", { cache: "no-cache" }).then((r) => r.json());
        const all = d.photos || [];
        if (!all.length) return;
        const n = Math.min(6, all.length);
        const pick = Array.from({ length: n }, (_, i) =>
          all[Math.round((i * (all.length - 1)) / (n - 1))]);
        document.getElementById("sheet").innerHTML = pick
          .map((f) => `<figure class="fr"><img alt="" loading="lazy" src="photos/${f}"></figure>`)
          .join("");
      } catch (e) { /* bez proužku */ }
    })();
  </script>
</body>
</html>
